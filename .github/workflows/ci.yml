# Checks only. Deployment is manual to Cloudflare Pages (project "prodory"); this workflow never deploys.
name: ci
on:
  pull_request:
  push:
    branches: [astro-redesign]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx astro check
      - run: npm run build
